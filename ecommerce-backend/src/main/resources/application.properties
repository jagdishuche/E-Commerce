server.port=${PORT:8080}

# Database Configuration:
# If SPRING_DATASOURCE_URL is provided (e.g. Cloud MySQL on Render), connects to it.
# Otherwise, defaults to embedded H2 (MySQL Mode) so cloud deployment works instantly with zero setup!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ecommerce_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# JWT Configuration (256-bit secret key in base64 / hex)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Logging
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=WARN
